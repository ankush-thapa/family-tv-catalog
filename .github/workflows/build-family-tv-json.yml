name: Build Family TV JSON

on:
  push:
    branches:
      - main
    paths:
      - catalog_source.py
      - build_family_tv_json.py
      - .github/workflows/build-family-tv-json.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate family_tv.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python build_family_tv_json.py

      - name: Commit generated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update generated family_tv.json"
          file_pattern: family_tv.json
